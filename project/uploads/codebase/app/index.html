<!doctype html>
<html lang="th">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f766e'/><rect x='9' y='12' width='14' height='2.6' rx='1.3' fill='white'/><rect x='9' y='17.4' width='14' height='2.6' rx='1.3' fill='white'/></svg>">
